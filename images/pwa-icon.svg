<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold/Emerald Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Mountain Silhouette (Karabakh & Zangazur Peaks) -->
  <g filter="url(#shadow)">
    <!-- Back mountain -->
    <polygon points="120,340 230,210 320,340" fill="#047857" opacity="0.6"/>
    <polygon points="210,340 310,180 410,340" fill="#059669" opacity="0.7"/>
    <!-- Front mountain -->
    <polygon points="150,350 256,190 362,350" fill="#065f46"/>
    <!-- Snow/Light cap -->
    <polygon points="256,190 238,225 256,220 274,225" fill="#ecfdf5" opacity="0.9"/>
  </g>

  <!-- Sun rays / Glow -->
  <circle cx="256" cy="180" r="42" fill="url(#goldGrad)" opacity="0.85" filter="url(#shadow)"/>

  <!-- Golden Wheat / Sprout Emblem -->
  <g filter="url(#shadow)">
    <!-- Central Sprout Stem -->
    <path d="M 256,380 Q 256,260 256,220" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Left leaves / grains -->
    <path d="M 256,330 C 210,310 200,270 230,260 C 245,268 253,290 256,310 Z" fill="url(#emeraldGrad)"/>
    <path d="M 256,280 C 220,260 215,225 240,215 C 252,225 255,248 256,265 Z" fill="url(#goldGrad)"/>
    
    <!-- Right leaves / grains -->
    <path d="M 256,330 C 302,310 312,270 282,260 C 267,268 259,290 256,310 Z" fill="url(#emeraldGrad)"/>
    <path d="M 256,280 C 292,260 297,225 272,215 C 260,225 257,248 256,265 Z" fill="url(#goldGrad)"/>

    <!-- Top Sprout Tip -->
    <path d="M 256,220 C 248,195 256,170 256,170 C 256,170 264,195 256,220 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Cadastre / Geo Grid lines subtle background -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="270" r="190" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6"/>

  <!-- Typography: INVESTAREA -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">INVESTAREA</text>
  <text x="256" y="450" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">QARABAĞ AQRO</text>
</svg>
